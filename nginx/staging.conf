# ==============================================================================
# Staging nginx — serves the staging frontend SPA + proxies to staging backend
# ==============================================================================
# This is used inside the staging nginx container (not the production nginx).
# Production nginx terminates SSL and proxies to this container on port 8080.
# ==============================================================================

upstream staging_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name staging.recurrsens.eu;

    client_max_body_size 50M;

    # --- API & Admin: proxy to staging Django ---
    location /api/ {
        proxy_pass http://staging_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://staging_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Example exercise recordings (FLAC). nginx's default mime.types has no
    # .flac entry, so without this they're served as application/octet-stream
    # and browsers refuse to play them.
    location /examples/ {
        root /usr/share/nginx/html;
        types {
            audio/flac flac;
        }
    }

    # --- Frontend: serve React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
