# ==============================================================================
# Demo nginx — serves the demo frontend SPA + proxies to demo backend
# ==============================================================================
# This is used inside the demo nginx container (not the production nginx).
# Production nginx terminates SSL and proxies to this container on port 80.
# ==============================================================================

upstream demo_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name demo.recurrsens.eu;

    client_max_body_size 50M;

    # --- API: proxy to demo Django backend ---
    location /api/ {
        proxy_pass http://demo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django static files (admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Example exercise recordings (FLAC)
    location /examples/ {
        root /usr/share/nginx/html;
        types {
            audio/flac flac;
        }
    }

    # --- Frontend: serve React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
