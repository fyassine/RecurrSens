# Pinned to the prod backend container's specific Compose-assigned name
# (project "recurrsens", service "backend", replica 1) rather than the
# generic "backend" DNS alias. Something else on this Docker network also
# answers to "backend" with ALLOWED_HOSTS that doesn't include recurrsens.eu,
# which made nginx round-robin ~50% of requests into DisallowedHost 400s.
upstream backend {
    server recurrsens-backend-1:8000;
}

# HTTP → HTTPS redirect + ACME challenge (all domains)
server {
    listen 80;
    server_name recurrsens.eu www.recurrsens.eu staging.recurrsens.eu 31.70.77.124;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# HTTPS — Production (recurrsens.eu)
# ==========================================================================
server {
    listen 443 ssl;
    server_name recurrsens.eu www.recurrsens.eu;

    ssl_certificate /etc/letsencrypt/live/recurrsens.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recurrsens.eu/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # --- Security headers (apply to all responses, incl. the SPA which Django's
    #     SecurityMiddleware does not cover) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone is required for the recording wizard; everything else is denied.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # 'unsafe-inline' for styles is required by Mantine; blob: media covers
    # locally-recorded audio playback. Validate in staging before tightening.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # --- API & Admin: proxy to Django ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # --- Dozzle log viewer ---
    location /logs/ {
        proxy_pass http://dozzle:8080/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
    }

    # Example exercise recordings (FLAC). nginx's default mime.types has no
    # .flac entry, so without this they're served as application/octet-stream
    # and X-Content-Type-Options: nosniff above causes browsers to refuse
    # to play them.
    location /examples/ {
        root /usr/share/nginx/html;
        types {
            audio/flac flac;
        }
    }

    # --- Frontend: serve React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

