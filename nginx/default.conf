upstream backend {
    server backend:8000;
}

# HTTP → HTTPS redirect + ACME challenge (all domains)
server {
    listen 80;
    server_name recurrsens.eu www.recurrsens.eu staging.recurrsens.eu 31.70.77.124;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# HTTPS — Production (recurrsens.eu)
# ==========================================================================
server {
    listen 443 ssl;
    server_name recurrsens.eu www.recurrsens.eu;

    ssl_certificate /etc/letsencrypt/live/recurrsens.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recurrsens.eu/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # --- API & Admin: proxy to Django ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }

    # --- Dozzle log viewer ---
    location /logs/ {
        proxy_pass http://dozzle:8080/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
    }

    # --- Frontend: serve React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Include staging config if SSL cert exists (activated by entrypoint script)
include /etc/nginx/conf.d/staging.conf;
