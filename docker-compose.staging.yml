# ==============================================================================
# Docker Compose — Staging Overrides (shares infra with production)
# ==============================================================================
# Usage (standalone — run alongside production project):
#   docker compose -p recurrsens-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# This overlay:
#   - Uses :staging tagged images
#   - Connects to the SAME db/redis/minio from the production project
#   - Uses a separate database, Redis DB, and S3 bucket
#   - Skips celery-beat (not needed in staging)
#   - Binds nginx to port 8080 (proxied by production nginx)
# ==============================================================================

services:
  # ── Shared infrastructure — disabled here, uses production's ─────────────
  db:
    profiles: [never]        # Don't start; use production's db container

  minio:
    profiles: [never]        # Don't start; use production's minio container

  redis:
    profiles: [never]        # Don't start; use production's redis container

  celery-beat:
    profiles: [never]        # Not needed in staging

  dozzle:
    profiles: [never]        # Not needed; production's dozzle sees all containers

  # ── Staging backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1
        --timeout 120
        --access-logfile -
        --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.recurrsens.eu}
      DB_NAME: ${DB_NAME:-stimmbandlaesion_staging}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: recurrsens-db-1               # Connect to production's db container
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT: http://recurrsens-minio-1:9000  # Connect to production's minio
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion-staging}
      CELERY_BROKER_URL: redis://recurrsens-redis-1:6379/1  # DB 1 (prod uses DB 0)
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
      APP_URL: ${APP_URL:-https://staging.recurrsens.eu}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.recurrsens.eu}
    depends_on: !reset {}      # Clear inherited depends_on (db/minio/redis)
    networks:
      - default
      - recurrsens_default     # Join production's network for db/redis/minio access
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Staging celery worker ───────────────────────────────────────────────────
  celery:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    command: celery -A config worker --loglevel=info --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      DB_NAME: ${DB_NAME:-stimmbandlaesion_staging}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: recurrsens-db-1
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT: http://recurrsens-minio-1:9000
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion-staging}
      CELERY_BROKER_URL: redis://recurrsens-redis-1:6379/1
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
    depends_on: !reset {}      # Clear inherited depends_on (db/redis)
    networks:
      - default
      - recurrsens_default
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Staging nginx ───────────────────────────────────────────────────────────
  nginx:
    image: ghcr.io/fyassine/recurrsens-nginx:staging
    ports:
      - "8080:80"              # Exposed on port 8080; production nginx proxies to this
    volumes:
      - staging_static_files:/app/staticfiles:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 48M

volumes:
  staging_static_files:
  static_files:                # Declared so compose doesn't error on base file reference

networks:
  recurrsens_default:
    external: true             # Attach to production's Docker network
