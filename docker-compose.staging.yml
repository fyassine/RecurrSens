# ==============================================================================
# Docker Compose — Staging (standalone, runs alongside production)
# ==============================================================================
# Usage:
#   docker compose -p recurrsens-staging \
#     -f docker-compose.staging.yml up -d
#
# Staging shares production's Postgres and Redis containers (reached over the
# external recurrsens_default network) but uses its own database
# (stimmbandlaesion_staging), Redis DB 1 and its own Garage container:
#   - Uses :staging tagged images
#   - DB_HOST / CELERY_BROKER_URL / DB_* come from .env (see deploy-staging.yml)
#   - Binds nginx to port 8080 (proxied by production nginx)
# ==============================================================================

services:
  # ── Staging object storage ──────────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - staging_garage_meta:/var/lib/garage/meta
      - staging_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 96M

  # ── Staging backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1
        --timeout 120
        --access-logfile -
        --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.recurrsens.eu}
      DB_NAME: ${DB_NAME:-stimmbandlaesion_staging}
      DB_USER: ${DB_USER:-stimmbandlaesion}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-staging}
      DB_HOST: ${DB_HOST:-recurrsens-db-1}
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stimmbandlaesion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-staging}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion-staging}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://recurrsens-redis-1:6379/1}
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
      APP_URL: ${APP_URL:-https://staging.recurrsens.eu}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.recurrsens.eu}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-stimmbandlaesion}
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - default
      - recurrsens_default     # reach production's db/redis
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Staging celery worker ───────────────────────────────────────────────────
  celery:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.recurrsens.eu}
      DB_NAME: ${DB_NAME:-stimmbandlaesion_staging}
      DB_USER: ${DB_USER:-stimmbandlaesion}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-staging}
      DB_HOST: ${DB_HOST:-recurrsens-db-1}
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stimmbandlaesion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-staging}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion-staging}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://recurrsens-redis-1:6379/1}
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - default
      - recurrsens_default     # reach production's db/redis
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Staging nginx ───────────────────────────────────────────────────────────
  nginx:
    image: ghcr.io/fyassine/recurrsens-nginx:staging
    restart: unless-stopped
    ports:
      - "8080:80"              # Exposed on port 8080; production nginx proxies to this
    volumes:
      - staging_static_files:/app/staticfiles:ro
    depends_on:
      - backend
    networks:
      - default
      - recurrsens_default     # Production nginx resolves this container here to proxy staging.recurrsens.eu
    deploy:
      resources:
        limits:
          memory: 48M

volumes:
  staging_static_files:
  staging_garage_meta:
  staging_garage_data:
  staging_minio_data:   # legacy, kept until migrated

networks:
  recurrsens_default:
    external: true             # nginx joins it so production nginx can proxy to staging; backend/celery for db/redis
