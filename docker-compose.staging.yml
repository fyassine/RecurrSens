# ==============================================================================
# Docker Compose — Staging (standalone, runs alongside production)
# ==============================================================================
# Usage:
#   docker compose -p recurrsens-staging \
#     -f docker-compose.staging.yml up -d
#
# This file is fully self-contained:
#   - Uses :staging tagged images
#   - Runs its own dedicated db, redis, and minio containers (no shared state
#     with production — avoids schema drift between staging and prod)
#   - Binds nginx to port 8080 (proxied by production nginx)
# ==============================================================================

services:
  # ── Staging database ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stimmbandlaesion}
      POSTGRES_USER: ${DB_USER:-stimmbandlaesion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stimmbandlaesion} -d ${DB_NAME:-stimmbandlaesion}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Staging cache / broker ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 32M

  # ── Staging object storage ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-stimmbandlaesion}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-in-staging}
    command: server /data --console-address ":9001"
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Staging backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    restart: unless-stopped
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1
        --timeout 120
        --access-logfile -
        --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.recurrsens.eu}
      DB_NAME: ${DB_NAME:-stimmbandlaesion}
      DB_USER: ${DB_USER:-stimmbandlaesion}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-staging}
      DB_HOST: db
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stimmbandlaesion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-staging}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion}
      CELERY_BROKER_URL: redis://redis:6379/0
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
      APP_URL: ${APP_URL:-https://staging.recurrsens.eu}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.recurrsens.eu}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-stimmbandlaesion}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Staging celery worker ───────────────────────────────────────────────────
  celery:
    image: ghcr.io/fyassine/recurrsens-backend:staging
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-staging}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.recurrsens.eu}
      DB_NAME: ${DB_NAME:-stimmbandlaesion}
      DB_USER: ${DB_USER:-stimmbandlaesion}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-staging}
      DB_HOST: db
      DB_PORT: "5432"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stimmbandlaesion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-staging}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-stimmbandlaesion}
      CELERY_BROKER_URL: redis://redis:6379/0
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://inference:8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Staging nginx ───────────────────────────────────────────────────────────
  nginx:
    image: ghcr.io/fyassine/recurrsens-nginx:staging
    restart: unless-stopped
    ports:
      - "8080:80"              # Exposed on port 8080; production nginx proxies to this
    volumes:
      - staging_static_files:/app/staticfiles:ro
    depends_on:
      - backend
    networks:
      - default
      - recurrsens_default     # Production nginx resolves this container here to proxy staging.recurrsens.eu
    deploy:
      resources:
        limits:
          memory: 48M

volumes:
  staging_static_files:
  staging_postgres_data:
  staging_minio_data:

networks:
  recurrsens_default:
    external: true             # Only nginx joins this, so production nginx can proxy to staging.recurrsens.eu
