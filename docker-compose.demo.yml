# ==============================================================================
# Docker Compose — Live Demo (ephemeral booth flow at demo.recurrsens.eu)
# ==============================================================================
# Usage:
#   docker compose -p recurrsens-demo \
#     -f docker-compose.demo.yml up -d
#
# Privacy guarantee:
#   Audio is processed entirely in-memory and discarded.
#   No MinIO, no Celery, no persistent audio storage.
#   Production nginx terminates SSL and proxies to recurrsens-demo-nginx-1:80.
# ==============================================================================

services:
  # ── Demo database (startup requirement for Django; never queried by demo) ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recurrsens_demo}
      POSTGRES_USER: ${DB_USER:-demo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_password_placeholder}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-demo_user} -d ${DB_NAME:-recurrsens_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Demo Django backend (ephemeral in-memory analysis) ─────────────────────
  backend:
    image: ghcr.io/fyassine/recurrsens-backend:demo
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-secret-key-placeholder}
      ALLOWED_HOSTS: demo.recurrsens.eu,recurrsens-demo-backend-1,backend,localhost
      DB_NAME: ${DB_NAME:-recurrsens_demo}
      DB_USER: ${DB_USER:-demo_user}
      DB_PASSWORD: ${DB_PASSWORD:-demo_password_placeholder}
      DB_HOST: db
      DB_PORT: "5432"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-demo_dummy_s3_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-demo_dummy_s3_secret_key}
      S3_BUCKET: ${S3_BUCKET:-dummy_demo_bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      CELERY_BROKER_URL: memory://
      DEMO_MODE_ENABLED: "true"
      DEMO_INFERENCE_BACKEND: ${DEMO_INFERENCE_BACKEND:-stub}
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:-http://recurrsens-ml-serving:8100}
      DEMO_MAX_RECORDINGS: "3"
      CORS_ALLOWED_ORIGINS: https://demo.recurrsens.eu
      APP_URL: https://demo.recurrsens.eu
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - recurrsens_default     # Joined so the demo backend can reach recurrsens-ml-serving
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Demo nginx (serves React SPA & proxies /api/ to demo backend) ─────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.demo
    image: ghcr.io/fyassine/recurrsens-nginx:demo
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - recurrsens_default     # Joined so production nginx can proxy demo.recurrsens.eu
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  demo_postgres_data:

networks:
  default:
  recurrsens_default:
    external: true
