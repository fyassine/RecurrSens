name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # ── 1. CI gate ──────────────────────────────────────────────────────────────
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: test
          S3_REGION: us-east-1
          CELERY_BROKER_URL: memory://
          APP_URL: http://localhost
        run: python manage.py test --verbosity=2

  # ── 2. Build & push images ──────────────────────────────────────────────────
  build:
    name: Build & push images
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/recurrsens-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/recurrsens-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose and config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,dozzle-users.yml"
          target: ~/recurrsens

      - name: Write .env on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > ~/recurrsens/.env << EOF
            # Django
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_SETTINGS_MODULE=${{ vars.DJANGO_SETTINGS_MODULE }}
            ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
            DJANGO_SUPERUSER_USERNAME=${{ vars.DJANGO_SUPERUSER_USERNAME }}
            DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}

            # Database (PostgreSQL)
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432

            # S3 / MinIO
            S3_REGION=${{ vars.S3_REGION }}
            S3_ACCESS_KEY=${{ vars.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_ENDPOINT=http://minio:9000
            S3_BUCKET=${{ vars.S3_BUCKET }}

            # Celery / Redis
            CELERY_BROKER_URL=redis://redis:6379/0

            # Inference Service
            INFERENCE_SERVICE_URL=${{ vars.INFERENCE_SERVICE_URL }}

            # App URL (for QR code generation)
            APP_URL=${{ vars.APP_URL }}

            # CORS
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}

            # CSRF (Django admin & session auth)
            CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS }}

            # Data retention
            DATA_RETENTION_DAYS=${{ vars.DATA_RETENTION_DAYS }}
            EOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/recurrsens

            echo "=== Pulling latest images ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -p recurrsens -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "=== Ensuring SSL cert exists (self-signed fallback) ==="
            CERT_LIVE="/etc/letsencrypt/live/recurrsens.eu/fullchain.pem"
            if [ -f "$CERT_LIVE" ] || [ -L "$CERT_LIVE" ]; then
              echo "Let's Encrypt cert found at $CERT_LIVE — no action needed"
            else
              LATEST=$(ls -d /etc/letsencrypt/live/recurrsens.eu-* 2>/dev/null | sort -V | tail -1)
              if [ -n "$LATEST" ] && [ -f "$LATEST/fullchain.pem" ]; then
                sudo mkdir -p /etc/letsencrypt/live/recurrsens.eu
                sudo ln -sfn "$LATEST/fullchain.pem" "$CERT_LIVE"
                sudo ln -sfn "$LATEST/privkey.pem" /etc/letsencrypt/live/recurrsens.eu/privkey.pem
                echo "Symlinked recurrsens.eu -> $LATEST"
              else
                sudo mkdir -p /etc/letsencrypt/live/recurrsens.eu
                sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                  -keyout /etc/letsencrypt/live/recurrsens.eu/privkey.pem \
                  -out /etc/letsencrypt/live/recurrsens.eu/fullchain.pem \
                  -subj "/CN=recurrsens.eu" 2>/dev/null
                echo "Self-signed cert created — replace with Let's Encrypt cert after DNS points here"
              fi
            fi

            echo "=== Restarting containers ==="
            docker compose -p recurrsens -f docker-compose.yml -f docker-compose.prod.yml up -d --wait

            echo "=== Reloading nginx upstream DNS ==="
            docker compose -p recurrsens -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload

            echo "=== Pruning old images ==="
            docker image prune -f

            echo "=== Verifying health ==="
            sleep 10
            docker compose -p recurrsens -f docker-compose.yml -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"
