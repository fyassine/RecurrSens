[tool.ruff]
# Django project — target the runtime Python version and keep line length
# generous to match the existing code style.
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line length handled by the formatter, not enforced hard
]

[tool.ruff.lint.per-file-ignores]
# Settings modules legitimately use star-imports and late re-binding.
"config/settings/*.py" = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "single"
