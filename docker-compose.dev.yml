# ==============================================================================
# Docker Compose — Development Overrides
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:
  # Datastore host ports are exposed only in dev (for local debugging / GUI
  # clients). Production keeps these services on the internal network only.
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # OPTIMIZE: Override production command with Django dev server
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      APP_URL: http://localhost:5173
    volumes:
      # Mount source code for hot-reload
      - ./backend:/app
    ports:
      - "8000:8000"

  celery:
    command: celery -A config worker --loglevel=debug
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app

  # OPTIMIZE: In dev, nginx is not used — run frontend dev server directly:
  #   cd frontend && npm run dev
  nginx:
    profiles: [production]  # Disable in dev
