# Lint/format config for the research tree.
#
# This directory is not part of the Django backend, so `backend/pyproject.toml`
# does not reach it. Keep the two in sync — same target version, same line
# length, same quote style — so contributors do not have to remember which
# subtree they are in.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter, not enforced hard
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals deliberately (STFT helpers, epsilons).
"audio_preprocessing/tests/*.py" = ["SLF001"]

[tool.ruff.format]
quote-style = "single"
