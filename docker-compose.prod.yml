# ==============================================================================
# Docker Compose — Production Overrides (Strato VPS: 1 vCPU / 1GB RAM)
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  db:
    ports: !reset []
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 192M

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 192M

  redis:
    ports: !reset []
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 48M

  backend:
    image: ghcr.io/fyassine/recurrsens-backend:latest
    build: !reset null
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1
        --timeout 120
        --access-logfile -
        --error-logfile -
    deploy:
      resources:
        limits:
          memory: 256M

  celery:
    image: ghcr.io/fyassine/recurrsens-backend:latest
    build: !reset null
    command: celery -A config worker --loglevel=info --concurrency=1
    deploy:
      resources:
        limits:
          memory: 192M

  celery-beat:
    image: ghcr.io/fyassine/recurrsens-backend:latest
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 96M

  nginx:
    image: ghcr.io/fyassine/recurrsens-nginx:latest
    build: !reset null
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 48M

  # --- Dozzle: container log viewer ---
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_BASE: /logs
    deploy:
      resources:
        limits:
          memory: 32M

  # --- Certbot: SSL certificate renewal ---
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  certbot_data:
  certbot_webroot:
