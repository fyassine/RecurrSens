# ==============================================================================
# Docker Compose — Production Overrides (Strato VPS: 1 vCPU / 1GB RAM)
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  db:
    ports: !reset []
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 192M

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 192M

  redis:
    ports: !reset []
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 48M

  backend:
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1
        --timeout 120
        --access-logfile -
        --error-logfile -
    deploy:
      resources:
        limits:
          memory: 256M

  celery:
    command: celery -A config worker --loglevel=info --concurrency=1
    deploy:
      resources:
        limits:
          memory: 192M

  celery-beat:
    deploy:
      resources:
        limits:
          memory: 96M

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 48M

  # --- Dozzle: container log viewer ---
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_BASE: /logs
    deploy:
      resources:
        limits:
          memory: 32M

# SSL renewal is handled by host certbot (systemd timer).
# If certbot writes ACME challenges in webroot mode, nginx serves them from /var/www/certbot.
# After successful renewal, reload nginx inside the running container to pick up new certificates:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload
